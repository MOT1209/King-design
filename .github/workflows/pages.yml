name: Deploy Gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Validate and build gallery
        run: python skills/motion-design/scripts/build_gallery.py
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -r skills/motion-design/assets/* _site/
          cp -r docs/images _site/images 2>/dev/null || true
          # fallback index
          cp _site/gallery.html _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
